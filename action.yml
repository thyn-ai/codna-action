name: "codna"
description: "Install codna from PyPI, then fix, review, or classify a repository through the same packaged local runtime users run locally."
branding:
  icon: "git-pull-request"
  color: "purple"

inputs:
  api-key:
    description: "Optional Codna license / metering key. Local packaged runs can leave this empty when provider keys are supplied by environment."
    required: false
    default: ""
  package-spec:
    description: "PyPI package spec to install. Default installs the latest published codna package; pin for deterministic CI, e.g. codna==0.1.43."
    required: false
    default: "codna"
  mode:
    description: "What codna does: 'fix' opens a fix PR; 'review' posts or computes PR review findings; 'secure' runs read-only SARIF reachability classification."
    required: false
    default: "fix"
  pr:
    description: "Review mode: PR to review/post to: number, owner/repo#123, or PR URL. Defaults to the triggering pull_request number."
    required: false
    default: ""
  diff:
    description: "Review mode: optional diff range, e.g. origin/main...HEAD. Defaults to the PR base...head."
    required: false
    default: ""
  post:
    description: "Review mode: post findings to the PR. Set 'false' to compute findings only."
    required: false
    default: "true"
  min-confidence:
    description: "Review mode: only report findings at or above this confidence."
    required: false
    default: ""
  blocking:
    description: "Review mode: 'true' makes the Codna Review check fail on a blocking-severity finding."
    required: false
    default: "false"
  effort:
    description: "Review mode: review depth: low, medium, or high."
    required: false
    default: ""
  issue:
    description: "Fix mode: what is broken. Optional if from-junit is set."
    required: false
    default: ""
  from-junit:
    description: "Fix mode: path to a JUnit/pytest XML report; codna derives failing tests from it."
    required: false
    default: ""
  from-sarif:
    description: "Secure mode: path to the scanner's SARIF report. Required when mode=secure."
    required: false
    default: ""
  reachability-engine:
    description: "Secure mode reachability engine: remote or local."
    required: false
    default: "remote"
  verification:
    description: "Secure mode optional codna-security.yaml manifest."
    required: false
    default: ""
  base-branch:
    description: "Base branch for the pull request. Empty uses the repository default branch."
    required: false
    default: ""
  model:
    description: "Planner/review model. Use provider-qualified IDs for deterministic routing, e.g. openai/gpt-5."
    required: false
    default: "repository.verified_agentic_v1"
  github-token:
    description: "Token with contents:write and pull-requests:write. Defaults to the workflow token."
    required: false
    default: ${{ github.token }}

outputs:
  pull-request-url:
    description: "URL of the pull request codna opened. Empty if no PR was opened."
    value: ${{ steps.codna.outputs.pull_request_url }}

runs:
  using: "composite"
  steps:
    - name: Install codna
      shell: bash
      env:
        CODNA_ACTION_PACKAGE_SPEC: ${{ inputs.package-spec }}
      run: |
        set -euo pipefail
        package_spec="${CODNA_ACTION_PACKAGE_SPEC:-codna}"
        if [ -z "$package_spec" ]; then
          echo "codna action package-spec cannot be empty" >&2
          exit 2
        fi
        if command -v pipx >/dev/null 2>&1; then
          pipx install --pip-args=--only-binary=codna --force "$package_spec"
        else
          python3 -m pip install --user --upgrade --only-binary=codna "$package_spec"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi
        codna --version

    - name: codna fix / review / secure
      id: codna
      shell: bash
      env:
        CODNA_API_KEY: ${{ inputs.api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CODNA_ACTION_REPOSITORY: ${{ github.repository }}
        CODNA_ACTION_SHA: ${{ github.sha }}
        CODNA_ACTION_MODE: ${{ inputs.mode }}
        CODNA_ACTION_MODEL: ${{ inputs.model }}
        CODNA_ACTION_ISSUE: ${{ inputs.issue }}
        CODNA_ACTION_FROM_JUNIT: ${{ inputs.from-junit }}
        CODNA_ACTION_FROM_SARIF: ${{ inputs.from-sarif }}
        CODNA_ACTION_REACHABILITY_ENGINE: ${{ inputs.reachability-engine }}
        CODNA_ACTION_VERIFICATION: ${{ inputs.verification }}
        CODNA_ACTION_BASE_BRANCH: ${{ inputs.base-branch }}
        CODNA_ACTION_PR: ${{ inputs.pr }}
        CODNA_ACTION_PR_DEFAULT: ${{ github.event.pull_request.number }}
        CODNA_ACTION_DIFF: ${{ inputs.diff }}
        CODNA_ACTION_POST: ${{ inputs.post }}
        CODNA_ACTION_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        CODNA_ACTION_BLOCKING: ${{ inputs.blocking }}
        CODNA_ACTION_EFFORT: ${{ inputs.effort }}
        CODNA_AGENT_CORE_READY_TIMEOUT_SECONDS: "120"
      run: |
        set -euo pipefail
        repo_url="https://github.com/${CODNA_ACTION_REPOSITORY}.git"
        if [ "$CODNA_ACTION_MODE" = "secure" ]; then
          if [ -z "$CODNA_ACTION_FROM_SARIF" ]; then
            echo "codna: mode=secure requires 'from-sarif'." >&2
            exit 2
          fi
          args=(secure "$repo_url" --ref "$CODNA_ACTION_SHA" --from-sarif "$CODNA_ACTION_FROM_SARIF" --engine "$CODNA_ACTION_REACHABILITY_ENGINE")
          [ -n "$CODNA_ACTION_VERIFICATION" ] && args+=(--verification "$CODNA_ACTION_VERIFICATION")
        elif [ "$CODNA_ACTION_MODE" = "review" ]; then
          pr="${CODNA_ACTION_PR:-$CODNA_ACTION_PR_DEFAULT}"
          if [ -z "$pr" ]; then
            echo "codna: mode=review needs a PR (input 'pr' or a pull_request event)." >&2
            exit 2
          fi
          args=(review . --pr "$pr" --json --model "$CODNA_ACTION_MODEL")
          [ "$CODNA_ACTION_POST" != "false" ] && args+=(--post)
          [ -n "$CODNA_ACTION_DIFF" ] && args+=(--diff "$CODNA_ACTION_DIFF")
          [ -n "$CODNA_ACTION_MIN_CONFIDENCE" ] && args+=(--min-confidence "$CODNA_ACTION_MIN_CONFIDENCE")
          [ "$CODNA_ACTION_BLOCKING" = "true" ] && args+=(--blocking)
          [ -n "$CODNA_ACTION_EFFORT" ] && args+=(--effort "$CODNA_ACTION_EFFORT")
        elif [ "$CODNA_ACTION_MODE" = "fix" ]; then
          args=(fix "$repo_url" --ref "$CODNA_ACTION_SHA" --open-pr --json --model "$CODNA_ACTION_MODEL")
          [ -n "$CODNA_ACTION_ISSUE" ] && args+=(--issue "$CODNA_ACTION_ISSUE")
          [ -n "$CODNA_ACTION_FROM_JUNIT" ] && args+=(--from-junit "$CODNA_ACTION_FROM_JUNIT")
          [ -n "$CODNA_ACTION_BASE_BRANCH" ] && args+=(--base-branch "$CODNA_ACTION_BASE_BRANCH")
        else
          echo "codna: unsupported mode '$CODNA_ACTION_MODE' (expected fix, review, or secure)." >&2
          exit 2
        fi
        set +e
        out="$(codna "${args[@]}" 2>/tmp/codna.err)"
        status=$?
        set -e
        cat /tmp/codna.err >&2 || true
        echo "$out"
        if [ "$CODNA_ACTION_MODE" = "fix" ]; then
          url="$(printf '%s' "$out" | python3 -c 'import json, sys; print((json.loads(sys.stdin.read()) or {}).get("pull_request_url") or "")' 2>/dev/null || true)"
          if [ -z "$url" ]; then
            url="$(printf '%s' "$out" | grep -Eo 'https://github\.com/[^[:space:]"]+/pull/[0-9]+' | head -1 || true)"
          fi
        else
          url=""
        fi
        echo "pull_request_url=$url" >> "$GITHUB_OUTPUT"
        {
          echo "### codna"
          if [ -n "$url" ]; then echo "Opened a PR: $url"; else echo '```'; echo "$out"; echo '```'; fi
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$status" -ne 0 ]; then
          exit "$status"
        fi
