# Ultralight security gate for repositories without application code.
# Managed by thyn-ai/security-toolchain (propagate bumps the pin).
name: security

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    uses: thyn-ai/security-toolchain/.github/workflows/security-smoke.yml@a5dbd1f75e95943a6bcf4d6e76d23cd769e9240c # v0.1.15
    permissions:
      contents: read
    with:
      mode: advisory
