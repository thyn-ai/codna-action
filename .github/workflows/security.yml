# Ultralight security gate for repositories without application code.
# Managed by thyn-ai/security-toolchain (propagate bumps the pin).
name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    uses: thyn-ai/security-toolchain/.github/workflows/security-smoke.yml@8e51672065fadc8c87a9e36be997869bc75ecffc # v0.1.11
    permissions:
      contents: read
    with:
      mode: advisory
