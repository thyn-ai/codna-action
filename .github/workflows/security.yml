# Ultralight security gate for repositories without application code.
# Managed by thyn-ai/security-toolchain (propagate bumps the pin).
name: security

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    uses: thyn-ai/security-toolchain/.github/workflows/security-smoke.yml@fb3fa5a0194d6888a721bfe2855c89cc1375ba89 # v0.1.14
    permissions:
      contents: read
    with:
      mode: advisory
