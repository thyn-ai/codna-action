# Ultralight security gate for repositories without application code.
# Managed by thyn-ai/security-toolchain (propagate bumps the pin).
name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    uses: thyn-ai/security-toolchain/.github/workflows/security-smoke.yml@b71521eb3933b7b30580dbd748c77ce96806e239 # v0.1.12
    permissions:
      contents: read
    with:
      mode: advisory
