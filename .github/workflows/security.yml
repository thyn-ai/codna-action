# Ultralight security gate for repositories without application code.
# Managed by thyn-ai/security-toolchain (propagate bumps the pin).
name: security

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    uses: thyn-ai/security-toolchain/.github/workflows/security-smoke.yml@ffe2ae22078e7eef4cd5751a97650db4c8043dd1 # v0.1.17
    permissions:
      contents: read
    with:
      mode: advisory
