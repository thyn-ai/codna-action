# Ultralight security gate for repositories without application code.
# Managed by thyn-ai/security-toolchain (propagate bumps the pin).
name: security

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    uses: thyn-ai/security-toolchain/.github/workflows/security-smoke.yml@901e5ebd81ec3ca9c241d99c60a3a525eadf1230 # v0.1.13
    permissions:
      contents: read
    with:
      mode: advisory
