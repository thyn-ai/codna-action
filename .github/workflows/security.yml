# Ultralight security gate for repositories without application code.
# Managed by thyn-ai/security-toolchain (propagate bumps the pin).
name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    uses: thyn-ai/security-toolchain/.github/workflows/security-smoke.yml@0f2d0d38018909b8ed359aa76693189630050e64 # v0.1.10
    permissions:
      contents: read
    with:
      mode: advisory
